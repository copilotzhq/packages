name: Publish Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check package versions
        run: npm run check:versions

      - name: Build packages
        run: npm run build

      - name: Test built packages and browser controller
        run: |
          node --test copilotz-admin/test/*.test.mjs
          node --test copilotz-chat-ui/tests/**/*.test.js
          node --test --experimental-strip-types copilotz-chat-ui/tests/**/*.test.ts
          npm -w copilotz-chat-adapter test

      - name: Publish unpublished package versions
        run: npm run publish:workspaces

      - name: Set up Deno for released-artifact validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Validate released facade, client and controller
        run: deno test --config contracts/deno.json --allow-all contracts/http-round-trip.test.ts
